<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예산관리</title>
<link rel="stylesheet" href="css/style.css?v=202609181643">
<script>document.documentElement.setAttribute("data-theme", localStorage.getItem("erpTheme") === "dark" ? "dark" : "light");</script>
</head>
<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <a class="app-brand" href="index.html"><span class="app-brand-text" data-i18n="moduleName"></span></a>

    <div class="app-nav-label" data-i18n="navSecMain"></div>
    <a class="app-nav-item" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="app-nav-text" data-i18n="navQuery"></span>
    </a>
    <a class="app-nav-item" href="view.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="14"/><line x1="12" y1="20" x2="12" y2="8"/><line x1="18" y1="20" x2="18" y2="4"/></svg>
      <span class="app-nav-text" data-i18n="navBudgetView"></span>
    </a>
    <a class="app-nav-item" href="ga-submit.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span class="app-nav-text" data-i18n="navGaSubmit"></span>
    </a>

    <div class="app-nav-label" data-i18n="navSecAdmin"></div>
    <a class="app-nav-item active" href="admin.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 4.4-3.4 8.2-8 9-4.6-.8-8-4.6-8-9V7z"/></svg>
      <span class="app-nav-text" data-i18n="navAdminShort"></span>
    </a>

    <div class="app-sidebar-foot">
      <button class="app-theme-btn" id="themeToggle" aria-label="theme"></button>
      <button class="lang-btn" data-lang="ko">한</button>
      <button class="lang-btn" data-lang="zh">中</button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <h1 data-i18n="appTitle"></h1>
      <nav class="nav-links">
        <a href="https://hyeongk215-boot.github.io/monthly-management-system/" data-i18n="navDashboard">← 통합 대시보드</a>
      </nav>
    </header>
<main>
  <div class="card">
    <h2 data-i18n="adminHeading"></h2>
    <p class="desc" data-i18n="adminDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="adminKeyLabel"></label>
        <input type="password" id="adminKey">
      </div>
      <div>
        <label data-i18n="adminYm"></label>
        <select id="adminYm"></select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="fetchBtn" data-i18n="adminFetch"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="adminChecklistHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="adminChecklistDesc"></p>
    <label style="font-size:13px; display:inline-flex; align-items:center; gap:6px; margin-bottom:8px;">
      <input type="checkbox" id="missingOnlyCheckbox"><span data-i18n="adminMissingOnlyLabel"></span>
    </label>
    <div class="status-grid" id="checklistGrid"></div>
  </div>

  <div class="card">
    <h2 data-i18n="gaReportHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="gaReportDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="corp"></label>
        <select id="gaReportCorp"></select>
      </div>
      <div>
        <label data-i18n="yearLabel"></label>
        <select id="gaReportYear"></select>
      </div>
      <div>
        <label data-i18n="periodLabel"></label>
        <select id="gaReportPeriodType">
          <option value="month" data-i18n="periodMonth"></option>
          <option value="quarter" data-i18n="periodQuarter"></option>
          <option value="half" data-i18n="periodHalf"></option>
          <option value="annual" data-i18n="periodAnnual"></option>
        </select>
      </div>
      <div id="gaReportPeriodValueWrap">
        <label data-i18n="periodValueLabel"></label>
        <select id="gaReportPeriodValue"></select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="fetchGaReportBtn" data-i18n="adminFetch"></button>
      <button class="btn-secondary" id="downloadGaReportBtn" data-i18n="adminDownload"></button>
    </div>
    <div id="gaReportMeta" style="font-size:13px; color:var(--muted); margin:10px 0;"></div>

    <h3 style="font-size:14px; margin-top:18px;" data-i18n="gaReportBudgetHeading"></h3>
    <div class="table-wrap"><table class="exp-table" id="gaReportBudgetTable"><thead></thead><tbody></tbody></table></div>

    <h3 style="font-size:14px; margin-top:18px;" data-i18n="gaReportActualHeading"></h3>
    <div class="table-wrap"><table class="exp-table" id="gaReportActualTable"><thead></thead><tbody></tbody></table></div>

    <h3 style="font-size:14px; margin-top:18px;" data-i18n="gaReportVarianceHeading"></h3>
    <div class="table-wrap"><table class="exp-table" id="gaReportVarianceTable"><thead></thead><tbody></tbody></table></div>
  </div>

  <div class="card">
    <h2 data-i18n="gaAggHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="gaAggDesc"></p>
    <div class="btn-row" style="align-items:center;">
      <span data-i18n="adminMonthStatus"></span>:
      <span class="badge" id="monthStatusBadge"></span>
      <button class="btn-danger" id="closeMonthBtn"></button>
    </div>
    <div class="form-grid">
      <div>
        <label data-i18n="corp"></label>
        <select id="gaAggFilterCorp"></select>
      </div>
      <div>
        <label data-i18n="office"></label>
        <select id="gaAggFilterOffice"></select>
      </div>
    </div>
    <div class="table-wrap">
      <table class="exp-table" id="gaAggTable">
        <thead>
          <tr>
            <th data-i18n="colCorp"></th>
            <th data-i18n="office"></th>
            <th data-i18n="colCategory"></th>
            <th data-i18n="colBudget"></th>
            <th data-i18n="colActual"></th>
            <th><span data-i18n="colDelete"></span></th>
          </tr>
        </thead>
        <tbody id="gaAggBody"></tbody>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="downloadGaBtn" data-i18n="adminDownload"></button>
      <button class="btn-danger" id="deleteGaSelectedBtn" data-i18n="adminDeleteSelectedBtn"></button>
    </div>
  </div>

    </main>
    <footer>예산관리 · China Branch Budget vs Actual</footer>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="js/config.js?v=202609181643"></script>
<script src="vendor/supabase.js"></script>
<script src="js/i18n.js?v=202609181643"></script>
<script src="js/common.js?v=202609181643"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/ga-categories.js?v=202609181643"></script>
<script src="js/app-admin.js?v=202609181643"></script>
</body>
</html>
