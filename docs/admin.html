<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예산관리</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1 data-i18n="appTitle">예산관리</h1>
  <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap;">
    <nav class="nav-links">
      <a href="index.html" data-i18n="backBtn">← 뒤로</a>
    </nav>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ko">한국어</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </div>
  </div>
</header>
<main>
  <div class="card">
    <h2 data-i18n="adminHeading"></h2>
    <p class="desc" data-i18n="adminDesc"></p>
    <div class="form-grid">
      <div>
        <label data-i18n="adminKeyLabel"></label>
        <input type="password" id="adminKey">
      </div>
      <div>
        <label data-i18n="adminCorp"></label>
        <select id="adminCorp"></select>
      </div>
      <div>
        <label data-i18n="adminYm"></label>
        <select id="adminYm"></select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="fetchBtn" data-i18n="adminFetch"></button>
    </div>

    <div class="btn-row" style="align-items:center;">
      <span data-i18n="adminMonthStatus"></span>:
      <span class="badge" id="monthStatusBadge"></span>
      <button class="btn-danger" id="closeMonthBtn"></button>
    </div>

    <div class="table-wrap">
      <table class="exp-table" id="budgetEditTable">
        <thead>
          <tr>
            <th data-i18n="colAccount"></th>
            <th data-i18n="colBudgetCny"></th>
            <th data-i18n="colActualCny"></th>
          </tr>
        </thead>
        <tbody id="budgetEditBody"></tbody>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="saveBudgetBtn" data-i18n="saveBudgetBtn"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="targetProfitHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="targetProfitDesc"></p>
    <div class="table-wrap">
      <table class="exp-table" id="targetProfitTable">
        <thead>
          <tr>
            <th data-i18n="office"></th>
            <th data-i18n="colTargetProfitCny"></th>
          </tr>
        </thead>
        <tbody id="targetProfitBody"></tbody>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="saveTargetProfitBtn" data-i18n="saveTargetProfitBtn"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="gaAggHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="gaAggDesc"></p>
    <div class="table-wrap">
      <table class="exp-table" id="gaAggTable">
        <thead>
          <tr>
            <th data-i18n="colCorp"></th>
            <th data-i18n="office"></th>
            <th data-i18n="colCategory"></th>
            <th data-i18n="colBudget"></th>
            <th data-i18n="colActual"></th>
          </tr>
        </thead>
        <tbody id="gaAggBody"></tbody>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="downloadGaBtn" data-i18n="adminDownload"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="aggHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="adminFilterHint"></p>
    <div class="status-grid" id="corpFilterGrid"></div>
    <div class="btn-row" id="filterAllWrap" style="display:none;">
      <button class="btn-secondary" id="filterAllBtn" data-i18n="adminFilterAll"></button>
    </div>
    <div class="summary-bar">
      <div><span data-i18n="totalRows"></span>: <b id="totalRows">0</b></div>
    </div>
    <div class="table-wrap">
      <table class="exp-table" id="aggTable">
        <thead>
          <tr>
            <th>#</th>
            <th data-i18n="colCorp"></th>
            <th data-i18n="colAccount"></th>
            <th data-i18n="colBudgetCny"></th>
            <th data-i18n="colActualCny"></th>
            <th data-i18n="colVarianceRate"></th>
          </tr>
        </thead>
        <tbody id="aggBody"></tbody>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="downloadBtn" data-i18n="adminDownload"></button>
    </div>
  </div>
</main>
<footer>예산관리 · China Branch Budget vs Actual</footer>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/ga-categories.js"></script>
<script src="js/app-admin.js"></script>
</body>
</html>
