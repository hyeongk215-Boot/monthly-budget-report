<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예산관리</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1 data-i18n="appTitle">예산관리</h1>
  <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap;">
    <nav class="nav-links">
      <a href="index.html" data-i18n="backBtn">← 뒤로</a>
      <a href="view.html" data-i18n="annualBudgetNavLink">연간 예산 입력</a>
    </nav>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ko">한국어</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </div>
  </div>
</header>
<main>
  <div class="card">
    <h2 data-i18n="gaSubmitHeading"></h2>
    <p class="desc" data-i18n="gaSubmitDesc"></p>
    <div class="context-bar" id="contextBar"></div>
    <div class="note-box" id="closedBanner" style="display:none;"></div>
    <div class="note-box" id="lockedBanner" style="display:none;"></div>

    <div class="table-wrap">
      <table class="exp-table" id="gaTable">
        <thead>
          <tr>
            <th rowspan="2" data-i18n="colCategory"></th>
            <th colspan="2" data-i18n="colBudget"></th>
            <th colspan="2" data-i18n="colActual"></th>
          </tr>
          <tr>
            <th data-i18n="colFixed"></th>
            <th data-i18n="colVariable"></th>
            <th data-i18n="colFixed"></th>
            <th data-i18n="colVariable"></th>
          </tr>
        </thead>
        <tbody id="gaBody"></tbody>
        <tfoot id="gaFoot"></tfoot>
      </table>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="submitGaBtn" data-i18n="submitTabBtn"></button>
    </div>
  </div>

  <div class="card">
    <h2 data-i18n="ytdRecapHeading" style="font-size:18px;"></h2>
    <p class="desc" data-i18n="ytdRecapDesc"></p>
    <div class="table-wrap">
      <table class="exp-table" id="ytdRecapTable">
        <thead>
          <tr id="ytdRecapHeadRow"><th data-i18n="colAccount"></th></tr>
        </thead>
        <tbody id="ytdRecapBody"></tbody>
      </table>
    </div>
  </div>
</main>
<footer>예산관리 · China Branch Budget vs Actual</footer>
<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/ga-categories.js"></script>
<script src="js/app-ga-submit.js"></script>
</body>
</html>
